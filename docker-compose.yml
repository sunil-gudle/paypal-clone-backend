version: '3.8'

services:

  # Redis only — MySQL is running locally on the host machine
  redis:
    image: redis:7.2-alpine
    container_name: paypal_redis
    restart: always
    ports:
      - "1234:1234"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
